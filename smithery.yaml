# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml

startCommand:
  type: stdio
  configSchema:
    # JSON Schema defining the configuration options for the MCP.
    type: object
    required: []
    properties:
      androidTvHost:
        type: string
        description: IP or hostname of the Android TV running Stremio. Needed only for the TV playback/control tools; leave empty to use the addon and library tools alone.
      androidTvPort:
        type: string
        default: "5555"
        description: adb TCP port on the Android TV.
      adbPath:
        type: string
        default: adb
        description: Path to the adb binary.
  commandFunction:
    # A function that produces the CLI command to start the MCP on stdio.
    |-
    (config) => ({ command: 'uvx', args: ['stremio-mcp'], env: { ANDROID_TV_HOST: config.androidTvHost || '', ANDROID_TV_PORT: config.androidTvPort || '5555', ADB_PATH: config.adbPath || 'adb' } })
