[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stremio-mcp"
version = "0.1.0"
description = "Unified MCP server for Stremio: addon search/streams + Android TV control"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yoan Wai" }]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
]

[project.scripts]
stremio-mcp = "stremio_mcp:cli"

[project.urls]
Homepage = "https://github.com/YoanWai/stremio-mcp"

[tool.setuptools.packages.find]
where = ["src"]
